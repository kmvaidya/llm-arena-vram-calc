name: Update Leaderboard

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

# A manual run and the daily one never push at the same time
concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install  # the version in .python-version

      - name: Install dependencies
        run: uv sync --locked  # exactly the versions in uv.lock

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy arena_enrichment/

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run enrichment pipeline
        run: uv run python arena_enrichment/enrich_arena.py --update-readme --health-file "$RUNNER_TEMP/health.md"

      - name: Commit and push if changed
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md arena_enrichment/output/ arena_enrichment/data/
          git diff --cached --quiet || git commit -m "Update leaderboard tables [automated]"
          git push

      # The pipeline publishes even when a source degrades (on its last good
      # data); this step turns the problems it found into a failed run, so the
      # next step reports them in the issue
      - name: Check data health
        run: |
          if [ -s "$RUNNER_TEMP/health.md" ]; then
            cat "$RUNNER_TEMP/health.md"
            exit 1
          fi

      # One open issue tracks a failure streak: later failures comment on it,
      # and the next healthy run closes it.
      - name: Report failure in the open issue
        if: failure()
        run: |
          details="Please check the run's log for details."
          if [ "$PUBLISHED" = "success" ] && [ -s "$RUNNER_TEMP/health.md" ]; then
            details="The tables were updated, but:

          $(cat "$RUNNER_TEMP/health.md")"
          fi
          issue=$(gh issue list --state open --label bug --limit 200 --json number,title \
            --jq '[.[] | select(.title | startswith("Leaderboard update failed"))][0].number // empty')
          body="The daily leaderboard update failed on $(date -u +%Y-%m-%d).

          **Run:** $RUN_URL

          $details"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create \
              --title "Leaderboard update failed (since $(date -u +%Y-%m-%d))" \
              --body "$body" \
              --label "bug"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.publish.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Close the failure issue
        if: success()
        run: |
          issues=$(gh issue list --state open --label bug --limit 200 --json number,title \
            --jq '.[] | select(.title | startswith("Leaderboard update failed")) | .number')
          for issue in $issues; do
            gh issue close "$issue" --comment "The daily leaderboard update succeeded again: $RUN_URL"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
