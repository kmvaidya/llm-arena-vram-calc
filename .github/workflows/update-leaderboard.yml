name: Update Leaderboard

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy arena_enrichment/

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run enrichment pipeline
        run: uv run python arena_enrichment/enrich_arena.py --update-readme

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md arena_enrichment/output/
          git diff --cached --quiet || git commit -m "Update leaderboard tables [automated]"
          git push

      # One open issue tracks a failure streak: later failures comment on it,
      # and the next successful run closes it.
      - name: Report failure in the open issue
        if: failure()
        run: |
          issue=$(gh issue list --state open --label bug --json number,title \
            --jq '[.[] | select(.title | startswith("Leaderboard update failed"))][0].number // empty')
          body="The daily leaderboard update failed on $(date -u +%Y-%m-%d).

          **Run:** $RUN_URL

          Please check the logs for details."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create \
              --title "Leaderboard update failed (since $(date -u +%Y-%m-%d))" \
              --body "$body" \
              --label "bug"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Close the failure issue
        if: success()
        run: |
          issues=$(gh issue list --state open --label bug --json number,title \
            --jq '.[] | select(.title | startswith("Leaderboard update failed")) | .number')
          for issue in $issues; do
            gh issue close "$issue" --comment "The daily leaderboard update succeeded again: $RUN_URL"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
